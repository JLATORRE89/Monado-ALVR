<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Loft</title>
<link rel="manifest" href="/static/loft.webmanifest">
<link rel="icon" type="image/png" href="/static/loft-192.png">
<link rel="apple-touch-icon" href="/static/loft-192.png">
<meta name="theme-color" content="#9c402c">
<style>
  :root {
    --bg: #0f1115; --surface: rgba(23, 26, 32, .82); --text: #e7e9ee; --muted: #9aa3b2; --line: rgba(255, 255, 255, .16);
    --accent: #7aa2ff; --accent-ink: #0b1020; --danger: #ff8a80;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Liberation Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center;
         padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
         pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
  #status.error { color: var(--danger); }
  .spacer { flex: 1; }
  button, a.btn { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
                  border-radius: 999px; padding: 8px 14px; min-height: 40px; text-decoration: none; cursor: pointer;
                  display: inline-flex; align-items: center; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #stick { position: fixed; left: max(28px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom));
           width: 150px; height: 150px; border-radius: 50%; background: rgba(15, 17, 21, .35); border: 2px solid var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
          background: rgba(231, 233, 238, .55); border: 2px solid rgba(255, 255, 255, .7); }
  .hint { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
          max-width: 46ch; margin: 0; padding: 6px 12px; border-radius: 12px; background: var(--surface);
          color: var(--muted); font-size: 13px; text-align: right; pointer-events: none; }
  /* Menu: Pictures and Videos */
  .menu, .viewer { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
                   padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                            max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .menu-head { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .menu-head h1 { font-size: 1.15rem; margin: 0 8px 0 0; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 12px; align-content: start; touch-action: pan-y; }
  .tile { position: relative; aspect-ratio: 16 / 10; padding: 0; border-radius: 12px; overflow: hidden;
          background: #1f232b; display: block; min-height: 0; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: var(--muted); }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 12px; text-align: left;
               background: linear-gradient(transparent, rgba(0, 0, 0, .75)); color: var(--text); }
  .tile.focus, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .menu-empty { color: var(--muted); }
  .viewer { z-index: 11; background: #000; padding: 0; }
  .viewer img, .viewer video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  .viewer-bar { display: flex; gap: 8px; align-items: center; justify-content: center;
                padding: 10px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)); }
  .viewer-bar .spacer { flex: 1; }
  @media (max-width: 600px) {
    #stick { width: 120px; height: 120px; } .hint { display: none; } #fullscreen { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Loft view"></canvas>
<div class="bar">
  <a class="btn" href="/" aria-label="Back to the XR Control Panel">‹ Panel</a>
  <span id="status" class="pill" role="status">Connecting…</span>
  <span class="spacer"></span>
  <button id="stand" class="primary" hidden>Stand up</button>
  <button id="voice" hidden aria-pressed="false">Voice</button>
  <button id="menu-btn">Menu</button>
  <button id="fullscreen">Full screen</button>
</div>
<div id="stick" aria-label="Walk"><div id="knob"></div></div>
<p class="hint"></p>
<div id="menu" class="menu" hidden role="dialog" aria-label="Loft menu">
  <div class="menu-head">
    <h1>Loft</h1>
    <button class="tab" data-kind="image" aria-selected="true">Pictures</button>
    <button class="tab" data-kind="video" aria-selected="false">Videos</button>
    <span class="spacer"></span>
    <button id="menu-close">Close</button>
  </div>
  <div id="grid" class="grid"></div>
  <p id="menu-empty" class="menu-empty" hidden></p>
</div>
<div id="viewer" class="viewer" hidden role="dialog" aria-label="Viewer">
  <img id="pic" alt="">
  <video id="vid" controls playsinline hidden></video>
  <div class="viewer-bar">
    <button id="viewer-prev" aria-label="Previous">‹ Previous</button>
    <span id="viewer-cap" class="pill"></span>
    <button id="viewer-next" aria-label="Next">Next ›</button>
    <span class="spacer"></span>
    <button id="viewer-back">Back</button>
  </div>
</div>
<script src="/static/tablet.js"></script>
</body>
</html>
